# Read by docker-java (shaded into Testcontainers) from the classpath root.
#
# Without this, docker-java 3.3.x falls back to Docker API version 1.32, and Docker Engine 29+
# refuses anything below 1.40 with HTTP 400 — Testcontainers then reports "Could not find a valid
# Docker environment" and every @Testcontainers test is silently skipped even though `docker` works.
# 1.44 is supported by Docker 25.0+ (2024) and by Engine 29, so it spans the versions this project
# is built and tested on. Remove it when Testcontainers is upgraded to a version that negotiates
# the API version itself (1.21.4+ / 2.x).
api.version=1.44
